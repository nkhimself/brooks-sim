<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Brooks Tick Replay</title>
<style>
  :root { --bg:#fff; --panel:#eef0f3; --line:#c9ced6; --fg:#15181d; --muted:#5d6670; --acc:#1f6feb; --up:#1a7f37; --dn:#c62828; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  button, select, input { font:inherit; color:var(--fg); }
  button { background:#fff; border:1px solid var(--line); border-radius:6px; padding:5px 9px; min-height:30px; }
  button:active { opacity:.8; }
  button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  input, select { background:#fff; border:1px solid var(--line); border-radius:6px; padding:4px 6px; min-height:30px; }
  input[type=number] { width:86px; }

  /* ---------- charts ---------- */
  #charts { position:fixed; inset:0; display:flex; flex-direction:row; background:#fff; }
  .pbox { position:relative; min-width:0; min-height:0; overflow:hidden; background:#fff; }
  #pbMain { flex:1 1 64%; }
  #side { display:none; flex:1 1 36%; flex-direction:column; min-width:0; min-height:0; }
  body.multi #side { display:flex; }
  #side .pbox { flex:1 1 50%; }
  .split { flex:0 0 8px; background:#d5d9e0; position:relative; touch-action:none; }
  .split::after { content:""; position:absolute; left:50%; top:50%; width:3px; height:26px; margin:-13px 0 0 -1.5px; border-radius:2px; background:#8d95a1; }
  #splitV { display:none; cursor:col-resize; }
  body.multi #splitV { display:block; }
  #splitH { cursor:row-resize; }
  #splitH::after { width:26px; height:3px; margin:-1.5px 0 0 -13px; }
  @media (orientation:portrait) {
    #charts { flex-direction:column; }
    #side { flex-direction:row; }
    #splitV { cursor:row-resize; } #splitV::after { width:26px; height:3px; margin:-1.5px 0 0 -13px; }
    #splitH { cursor:col-resize; } #splitH::after { width:3px; height:26px; margin:-13px 0 0 -1.5px; }
  }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  .hud { position:absolute; left:6px; top:3px; font-size:12px; color:#333; pointer-events:none; font-variant-numeric:tabular-nums; text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff; white-space:nowrap; max-width:calc(100% - 80px); overflow:hidden; text-overflow:ellipsis; }
  .hud b { font-weight:600; }
  .tfbtn { position:absolute; left:6px; top:4px; padding:2px 8px; min-height:22px; font-size:12px; background:rgba(255,255,255,.85); }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); pointer-events:none; text-align:center; padding:20px; z-index:5; background:rgba(255,255,255,.7); }

  /* ---------- floating menu button ---------- */
  #fabWrap { position:fixed; z-index:30; left:10px; top:34px; width:46px; height:46px; touch-action:none; }
  #fab { position:absolute; left:0; top:0; width:46px; height:46px; border-radius:50%; border:0; padding:0; background:rgba(31,111,235,.9); color:#fff; font-size:22px; line-height:1; box-shadow:0 1px 6px rgba(0,0,0,.35); touch-action:none; }
  #fab.tool { background:rgba(214,92,0,.95); }
  .q { position:absolute; top:6px; width:34px; height:34px; border-radius:50%; padding:0; min-height:0; background:rgba(255,255,255,.92); border:1px solid #9aa4b2; font-size:15px; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  body.noquick .q { display:none; }

  /* ---------- radial menu ---------- */
  #ring { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.12); }
  #ringBox { position:absolute; border-radius:50%; box-shadow:0 2px 14px rgba(0,0,0,.4); }
  .ritem { position:absolute; border-radius:50%; border:0; padding:0; background:transparent; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; min-height:0; }
  .ritem .ic { font-size:18px; } .ritem .tx { font-size:9px; margin-top:1px; white-space:nowrap; }
  .ritem.on { background:rgba(255,255,255,.3); box-shadow:inset 0 0 0 1.5px #fff; }
  .ritem:active { background:rgba(255,255,255,.4); }
  #ringX { position:absolute; width:36px; height:36px; margin:-18px 0 0 -18px; border-radius:50%; background:rgba(255,255,255,.85); border:0; padding:0; font-size:15px; min-height:0; }
  #ringTitle { position:absolute; width:100px; margin-left:-50px; text-align:center; font-size:11px; color:#fff; text-shadow:0 0 4px #000; pointer-events:none; }

  /* ---------- mode chip, selection bar, toast, tooltip ---------- */
  #modechip, #selbar { position:fixed; z-index:35; top:6px; left:50%; transform:translateX(-50%); background:rgba(20,24,30,.88); color:#fff; border-radius:16px; padding:5px 6px 5px 12px; font-size:12px; display:flex; gap:8px; align-items:center; max-width:80vw; }
  #modechip button, #selbar button { min-height:24px; padding:2px 9px; background:rgba(255,255,255,.18); border:0; color:#fff; border-radius:12px; }
  #toast { position:fixed; z-index:80; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(20,24,30,.92); color:#fff; border-radius:8px; padding:8px 14px; font-size:13px; max-width:86vw; text-align:center; pointer-events:none; }
  #tip { position:fixed; z-index:36; background:#fffbe6; border:1px solid #d4b106; border-radius:8px; padding:6px 10px; font-size:12px; max-width:260px; box-shadow:0 2px 8px rgba(0,0,0,.25); pointer-events:none; }
  [hidden] { display:none !important; }

  /* ---------- trade card ---------- */
  #card { position:fixed; z-index:40; right:8px; top:8px; width:min(318px,48vw); max-height:calc(100dvh - 16px); overflow:auto; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 3px 16px rgba(0,0,0,.35); padding:8px 9px; font-size:12px; }
  #card .chead { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  #card .chead b { flex:1; font-size:13px; }
  #card .sec { border-top:1px solid #e4e7ec; margin-top:6px; padding-top:6px; }
  #card .row { display:flex; gap:5px; align-items:center; flex-wrap:wrap; margin:3px 0; }
  #card label { display:flex; align-items:center; gap:4px; }
  #card small { color:var(--muted); }
  #card .big { min-height:34px; font-weight:600; }
  .buy { background:#1a7f37 !important; border-color:#1a7f37 !important; color:#fff !important; }
  .sell { background:#c62828 !important; border-color:#c62828 !important; color:#fff !important; }
  .live { font-size:13px; font-variant-numeric:tabular-nums; }
  .pos { color:var(--up); } .neg { color:var(--dn); }
  .chip { padding:2px 8px; min-height:26px; }
  .rule { display:flex; gap:6px; align-items:center; background:#f3f5f8; border-radius:6px; padding:3px 6px; margin:2px 0; }
  .rule.done { opacity:.5; text-decoration:line-through; }
  .rule span { flex:1; }

  /* ---------- journal / report ---------- */
  #report { position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column; }
  #rhead { display:flex; gap:6px; align-items:center; padding:6px 8px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #rhead .grow { flex:1; }
  #rbody { flex:1; overflow:auto; padding:8px 10px 24px; -webkit-user-select:text; user-select:text; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:6px; margin-bottom:10px; }
  .kc { background:#f3f5f8; border-radius:8px; padding:6px 9px; }
  .kc .k { font-size:11px; color:var(--muted); } .kc .v { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
  table.t { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  table.t th, table.t td { text-align:right; padding:5px 7px; border-bottom:1px solid #e4e7ec; white-space:nowrap; }
  table.t th:first-child, table.t td:first-child { text-align:left; }
  table.t th { font-size:11px; color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--bg); }
  .bar { display:inline-block; height:8px; border-radius:3px; vertical-align:middle; min-width:1px; }
  #eq { position:relative; inset:auto; width:100%; height:150px; display:block; background:#fafbfc; border:1px solid #e4e7ec; border-radius:8px; margin-bottom:10px; }
  .tr-edit td { background:#f8fafc; text-align:left !important; white-space:normal !important; }
  textarea { width:100%; min-height:90px; font:11px/1.3 ui-monospace,Menlo,Consolas,monospace; }
  #prac { position:fixed; z-index:45; left:50%; top:50%; transform:translate(-50%,-50%); width:min(380px,92vw); max-height:92dvh; overflow:auto; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 3px 18px rgba(0,0,0,.4); padding:10px 12px; font-size:13px; }
  #prac .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:6px 0; } #prac label { display:flex; gap:4px; align-items:center; } #prac .big { min-height:36px; font-weight:600; }
  #card .chk { display:flex; gap:6px; align-items:flex-start; margin:2px 0; } #card .chk input { margin-top:2px; }
  #dateIn { position:fixed; left:-300px; top:0; opacity:0; width:10px; height:10px; }
</style>
</head>
<body>
<div id="charts">
  <div class="pbox" id="pbMain"><canvas></canvas><div class="hud" id="hudMain"></div><div id="msg">Loading data…</div></div>
  <div class="split" id="splitV" title="Drag to resize"></div>
  <div id="side">
    <div class="pbox" id="pb1"><canvas></canvas><button class="tfbtn" id="tfb1">15m</button></div>
    <div class="split" id="splitH" title="Drag to resize"></div>
    <div class="pbox" id="pb2"><canvas></canvas><button class="tfbtn" id="tfb2">1h</button></div>
  </div>
</div>

<div id="fabWrap">
  <button class="q" id="qPlay" aria-label="Play / pause">▶</button>
  <button id="fab" aria-label="Menu">☰</button>
  <button class="q" id="qNext" aria-label="Next bar">⏭</button>
</div>
<div id="modechip" hidden><span id="modetxt"></span><button id="modex">Done</button></div>
<div id="selbar" hidden><span>Drawing selected</span><button id="selDel">Delete</button><button id="selDone">Done</button></div>
<div id="ring" hidden><div id="ringBox"></div></div>
<div id="card" hidden></div>
<div id="report" hidden></div>
<div id="prac" hidden></div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<input type="date" id="dateIn" aria-label="Replay day" tabindex="-1">
<script>
"use strict";
// Where the data lives (public Supabase bucket). For tests you can open the page with ?data=some/folder/
const DATA_BASE = (() => {
  const q = new URLSearchParams(location.search).get("data");
  if (q) return q.endsWith("/") ? q : q + "/";
  return "https://drknygdsfirqaypagosr.supabase.co/storage/v1/object/public/ticks/";
})();
const VER = "4.2";

// ---------- constants ----------
const TFS = [5, 15, 45, 60, 1440];
const TF_LABEL = { 5: "5m", 15: "15m", 45: "45m", 60: "1h", 1440: "1D" };
const SESSION_MS = 405 * 60000;              // 09:30 -> 16:15 New York = 81 five-minute bars
const OPEN_MIN = 9 * 60 + 30;
const PAD = 5;                               // empty slots right of the live bar
const K = 2 / 21;                            // 20-period EMA
const AXIS_W = 64, AXIS_H = 20, SNAP = 0.25, MIN_RISK = 0.5;
const DEF_VIS = { 5: 81, 15: 54, 45: 27, 60: 27, 1440: 20 };
const DEF_TAGS = ["Wedge", "Double top", "Double bottom", "Failed breakout", "Breakout pullback", "Opening reversal",
  "Trend from the open", "Trading range fade", "Major trend reversal", "Trend channel line", "20-gap-bar", "Second entry (H2/L2)", "Other"];
const tfMs = t => t === 1440 ? SESSION_MS : t * 60000;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const snap = v => Math.round(v / SNAP) * SNAP;

// ---------- small storage helpers (never throw) ----------
const LS = {
  get(k, d) { try { const v = localStorage.getItem("brooks4." + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("brooks4." + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
};
const S = Object.assign({ hideRandom: true, ema: true, gap: true, nums: true, refs: true, multi: false, quick: true, wake: true, land: false,
  pracFrom: "09:30", pracTo: "11:00", pracN: 5, pracMode: "row", ruleCheck: false, rules: null, fab: null, mainFrac: 0.64, sideFrac: 0.5, tags: null, side: [15, 60], speed: 10, tf: 5, lastSide: "L" }, LS.get("settings", {}));
if (!Array.isArray(S.tags) || !S.tags.length) S.tags = DEF_TAGS.slice();
const saveSettings = () => LS.set("settings", S);

// ---------- offline cache (IndexedDB): day files are kept once loaded ----------
const IDB = {
  p: null,
  open() {
    return this.p || (this.p = new Promise(res => {
      try {
        const r = indexedDB.open("brooks-cache", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("f");
        r.onsuccess = () => res(r.result); r.onerror = () => res(null);
      } catch (e) { res(null); }
    }));
  },
  async get(k) {
    const db = await this.open(); if (!db) return null;
    return new Promise(res => { try { const q = db.transaction("f").objectStore("f").get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } });
  },
  async put(k, v) {
    const db = await this.open(); if (!db) return;
    try { db.transaction("f", "readwrite").objectStore("f").put(v, k); } catch (e) { /* ignore */ }
  },
  async clear() {
    const db = await this.open(); if (!db) return;
    return new Promise(res => { try { const q = db.transaction("f", "readwrite").objectStore("f").clear(); q.onsuccess = q.onerror = () => res(); } catch (e) { res(); } });
  },
  async count() {
    const db = await this.open(); if (!db) return 0;
    return new Promise(res => { try { const q = db.transaction("f").objectStore("f").count(); q.onsuccess = () => res(q.result); q.onerror = () => res(0); } catch (e) { res(0); } });
  }
};
// day files never change -> cache first. Everything else -> network first, cached copy if offline or slow.
async function getBuf(url, immutable) {
  const cached = await IDB.get(url);
  if (cached && immutable) return cached;
  const ctl = new AbortController();
  const to = cached ? setTimeout(() => ctl.abort(), 6000) : 0;
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (to) clearTimeout(to);
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(url + " -> HTTP " + r.status);
    const buf = await r.arrayBuffer();
    IDB.put(url, buf);
    return buf;
  } catch (e) {
    if (to) clearTimeout(to);
    if (cached) return cached;
    throw e;
  }
}
async function getJSON(url) { const b = await getBuf(url, false); return b ? JSON.parse(new TextDecoder().decode(b)) : null; }
async function getDayBytes(url) {
  const buf = await getBuf(url, true); if (!buf) throw new Error(url + " not found");
  let u8 = new Uint8Array(buf);
  if (u8[0] === 0x1f && u8[1] === 0x8b) {          // gzip: unpack in the browser
    const ds = new DecompressionStream("gzip");
    u8 = new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer());
  }
  return u8;
}

// ---------- state ----------
let days = [];            // [{date, file, ms, bid, ask}]
const dayOf = {};         // date -> index (indexes move when older years are added, so everything saved uses dates)
let daily = {};           // date -> [o,h,l,c] (x1000)
const months = {};        // 'YYYY-MM' -> {date: [[bar,o,h,l,c],...]}
const HIST = 40;
let histN = HIST, extending = false, hideDate = false;
let dayIdx = 0, clock = 0, ptr = 0, playing = false, speed = S.speed || 10;
let bars = {};            // tf -> [{d,b,o,h,l,c,e}]
let lastPrice = null, busy = false, restoring = false;
let refs = { day: [], week: [], month: [] };
let trades = [];          // journal + active trades (see trading section)
let live = [];            // active trades of the replay day (draft, pending, open)
let drawings = [];        // chart drawings, points are {date, ms, p}
let tool = null;          // null | cross | h | tl | rect | ch | fib

// ---------- bar building: only ticks up to `clock` are ever added ----------
function mergeBar(t, d, b, o, h, l, c) {
  const arr = bars[t], last = arr[arr.length - 1];
  if (last && last.d === d && last.b === b) {
    if (h > last.h) last.h = h;
    if (l < last.l) last.l = l;
    last.c = c;
    const pe = arr.length > 1 ? arr[arr.length - 2].e : c;
    last.e = pe + (c - pe) * K;
  } else {
    const pe = last ? last.e : c;
    arr.push({ d, b, o, h, l, c, e: pe + (c - pe) * K });
  }
}
function bucketOf(t, ms) { return t === 1440 ? 0 : Math.floor(ms / (t * 60000)); }
function addTick(d, ms, p) { for (const t of TFS) mergeBar(t, d, bucketOf(t, ms), p, p, p, p); }

function readVarints(u8, pos, end, out) {
  let n = 0;
  while (pos < end) {
    let v = 0, sh = 1, byte;
    do { byte = u8[pos++]; v += (byte & 0x7f) * sh; sh *= 128; } while (byte & 0x80);
    out[n++] = v;
  }
  return n;
}
async function loadTicks(i) {
  const D = days[i];
  if (D.ms) return;
  const u8 = await getDayBytes(DATA_BASE + D.file);
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const n = dv.getUint32(0, true), la = dv.getUint32(4, true), lb = dv.getUint32(8, true);
  const pa = 12, pb = pa + la, pc = pb + lb;
  const a = new Float64Array(n), b = new Float64Array(n), c = new Float64Array(n);
  readVarints(u8, pa, pb, a); readVarints(u8, pb, pc, b); readVarints(u8, pc, u8.length, c);
  D.ms = new Uint32Array(n); D.bid = new Int32Array(n); D.ask = new Int32Array(n);
  let m = 0, x = 0, sp = 0;
  const unz = v => (v % 2 === 0 ? v / 2 : -(v + 1) / 2);
  for (let k = 0; k < n; k++) {
    m += a[k]; x += unz(b[k]); sp += unz(c[k]);
    D.ms[k] = m; D.bid[k] = x; D.ask[k] = x + sp;
  }
}
async function loadMonth(key) {
  if (months[key]) return;
  let j = null;
  try { j = await getJSON(DATA_BASE + "m_" + key + ".json"); } catch (e) { j = null; }
  months[key] = j || {};
}

// ---------- prior-period lines (previous day / week / month high, low, close) ----------
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDate(s) { const [y, m, d] = s.split("-").map(Number); return d + " " + MON[m - 1]; }
function fmtDateLong(s) { const dt = new Date(s + "T00:00:00Z"); return WD[dt.getUTCDay()] + " " + fmtDate(s) + " " + s.slice(0, 4); }
function weekKey(s) {
  const dt = new Date(s + "T00:00:00Z"), dow = (dt.getUTCDay() + 6) % 7;
  return new Date(dt.getTime() - dow * 86400000).toISOString().slice(0, 10);
}
function groupRefs(prefix, name, keyFn, rangeText) {
  const cur = keyFn(days[dayIdx].date);
  let k = dayIdx - 1;
  while (k >= 0 && keyFn(days[k].date) === cur) k--;
  if (k < 0) return [];
  const g = keyFn(days[k].date), last = k;
  let hi = -Infinity, lo = Infinity, first = k, close = null;
  for (; k >= 0 && keyFn(days[k].date) === g; k--) {
    const d = daily[days[k].date]; if (!d) continue;
    if (close === null) close = d[3];
    hi = Math.max(hi, d[1]); lo = Math.min(lo, d[2]); first = k;
  }
  if (close === null) return [];
  const when = rangeText(days[first].date, days[last].date);
  return [
    { id: prefix + "H", name: name + " high", price: hi / 1000, when, col: "#b3261e" },
    { id: prefix + "L", name: name + " low", price: lo / 1000, when, col: "#1b7a3a" },
    { id: prefix + "C", name: name + " close", price: close / 1000, when, col: "#6a3fb0" }
  ];
}
function computeRefs() {
  refs = { day: [], week: [], month: [] };
  if (!days.length || dayIdx < 1) return;
  const pd = daily[days[dayIdx - 1].date];
  if (pd) {
    const when = fmtDateLong(days[dayIdx - 1].date);
    refs.day = [
      { id: "PDH", name: "Previous day high", price: pd[1] / 1000, when, col: "#b3261e" },
      { id: "PDL", name: "Previous day low", price: pd[2] / 1000, when, col: "#1b7a3a" },
      { id: "PDC", name: "Previous day close", price: pd[3] / 1000, when, col: "#6a3fb0" }
    ];
  }
  refs.week = groupRefs("PW", "Previous week", weekKey, (a, b) => "week of " + fmtDate(a) + (a === b ? "" : " to " + fmtDate(b)) + " " + b.slice(0, 4));
  refs.month = groupRefs("PM", "Previous month", s => s.slice(0, 7), a => MON[Number(a.slice(5, 7)) - 1] + " " + a.slice(0, 4));
}
function refsFor(tf) { return tf === 1440 ? refs.month : tf === 60 ? refs.week : refs.day; }

// ---------- replay ----------
// bars of all days before the replay day: 5m..1h only for the last histN days, one daily bar for every older day
function buildHistory(i) {
  const rs = Math.max(0, i - histN);
  bars = {}; for (const t of TFS) bars[t] = [];

  if (c >= SESSION_MS && hideDate) { hideDate = false; toast("Day finished: it was " + fmtDateLong(days[dayIdx].date), 5000); }

//   rules:[{kind:'R'|'pts', v, pct, be, done}], openMs, closeMs, R, mfe, mae, setup, note}
// Risk per trade is always 1R = distance from the entry to the first stop. No account balance, no spread.

}
function typeFor(t) { return dirOf(t) * (t.entry - lastPrice) > 0 ? "stop" : "limit"; }

function pracDates(n, mode) {
  const last = days.length - 1, pool = last;           // day 0 has no history before it
  n = clamp(n, 1, Math.max(1, pool));

    const set = new Set(); while (set.size < n) set.add(1 + Math.floor(Math.random() * pool));
    return [...set];

  const n = list.length, Rs = list.map(t => t.R), EPS = 0.05;
  const wins = Rs.filter(r => r > EPS), loss = Rs.filter(r => r < -EPS);

  for (const r of Rs) { cum += r; peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum); if (r < -EPS) { streak++; ms = Math.max(ms, streak); } else streak = 0; }

    avgWin: wins.length ? sw / wins.length : 0, avgLoss: loss.length ? -sl / loss.length : 0, pf: sl > 0 ? sw / sl : (sw > 0 ? Infinity : 0), dd, ms,
    best: n ? Math.max(...Rs) : 0, worst: n ? Math.min(...Rs) : 0 };
}

    kc("Average win", fR(s.avgWin), "pos") + kc("Average loss", fR(s.avgLoss), "neg") + kc("Profit factor", s.pf === Infinity ? "∞" : f2(s.pf)) +

function groupTable(title, list, keyFn, sortFn) {
